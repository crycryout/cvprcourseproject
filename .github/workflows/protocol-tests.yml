name: Protocol correctness
on: [push, pull_request]
jobs:
  cpu-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==1.26.4 pytest==8.3.4
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python -m cvpr_project --help
      - run: python scripts/make_matrix.py --output artifacts/serving_matrix_v2.json
      - if: ${{ hashFiles('results/delivery.json') != '' }}
        run: python scripts/verify_results.py

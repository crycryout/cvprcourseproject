[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-detr-serving"
version = "3.0.0"
description = "Global versus local batching for real multi-host DETR inference"
requires-python = ">=3.10"
dependencies = ["torch==2.14.0", "transformers==4.46.3", "numpy==1.26.4", "pillow==10.4.0", "pycocotools==2.0.8", "matplotlib==3.9.2", "pandas==2.2.3", "reportlab==4.2.5"]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
